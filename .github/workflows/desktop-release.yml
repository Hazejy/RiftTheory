name: Build desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.platform }} installer
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis
          - platform: macos-latest
            bundles: dmg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        working-directory: RiftTheory
        run: bun install --frozen-lockfile

      - name: Build and publish installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: RiftTheory/apps/frontend
          tauriScript: bunx tauri build
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: RiftTheory ${{ github.ref_name }}
          releaseBody: |
            Windows: download `RiftTheory_*_x64-setup.exe` (not an `.msi`).
            macOS: download the `.dmg` file.

            Windows SmartScreen may show an unknown-publisher warning until the app is code-signed.
            For a private repository, your friend must first be invited as a repository collaborator.
