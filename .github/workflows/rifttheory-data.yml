name: Refresh RiftTheory champion data

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rifttheory-champion-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: draftgap
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refresh published champion data
        run: bun run data:refresh

      - name: Commit a new Riot patch
        run: |
          if git diff --quiet -- apps/frontend/public/data/rifttheory-knowledge.json; then
            echo "RiftTheory champion data is already current."
            exit 0
          fi
          git config user.name "RiftTheory Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/frontend/public/data/rifttheory-knowledge.json
          patch=$(bun -e 'const data = await Bun.file("apps/frontend/public/data/rifttheory-knowledge.json").json(); console.log(data.metadata.latestPatch.version)')
          git commit -m "data: update Riot champion data to ${patch}"
          git push
